name: Publish to npm

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/

      - name: Update npm
        # npm stage requires >= 11.15.0
        run: npm install -g npm@11

      # setup-node writes _authToken=${NODE_AUTH_TOKEN} and a dummy token when no
      # secret is set, which blocks npm OIDC trusted publishing (404 on PUT).
      - name: Enable npm OIDC auth
        run: |
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build --if-present

      # Trusted Publisher allows npm stage publish; a maintainer must then
      # `npm stage approve <stage-id>` (with 2FA) to make the version live.
      - name: Stage publish to npm (OIDC)
        run: npm stage publish --access public
